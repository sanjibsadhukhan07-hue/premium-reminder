<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Policy - KFS Premium Reminder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="topbar">
    <div class="brand">
        <img th:src="@{/images/logo.png}" alt="KFS">
        <strong>Premium Reminder</strong>
    </div>
    <div><a th:href="@{/logout}">Logout</a></div>
</div>
<div class="container">
    <div class="card" th:if="${customer != null}">
        <h2 th:text="'Welcome, ' + ${customer.fullName}"></h2>
        <p><strong>Policy Number:</strong> <span th:text="${customer.policyNumber}"></span></p>
        <p><strong>Insurer:</strong> <span th:text="${customer.insurerName}"></span></p>
        <p><strong>Premium Amount:</strong> <span th:text="${customer.premiumAmount}"></span></p>
        <p><strong>Next Due Date:</strong> <span th:text="${customer.nextDueDate}"></span></p>
        <p>
            <strong>Status:</strong>
            <span th:if="${customer.paid}" class="badge badge-paid">Paid</span>
            <span th:if="${!customer.paid}" class="badge badge-due">Pending</span>
        </p>
    </div>
    <div class="card" th:if="${customer == null}">
        No policy is linked to your account yet. Please contact support.
    </div>
</div>
</body>
</html>

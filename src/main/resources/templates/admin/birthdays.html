<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Birthdays - KFS Premium Reminder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <div th:replace="~{fragments/topbar :: favicon}"></div>
    <style>
        .pager-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; justify-content: space-between; }
        .pager-bar select { padding: 4px 8px; }
        .pager-arrow { padding: 5px 12px; font-size: 15px; line-height: 1; }
    </style>
</head>
<body>
<div th:replace="~{fragments/topbar :: admin('birthdays')}"></div>
<div class="container">
    <div class="card" th:if="${wishSent}" style="color:#1e8e50;">
        <span th:text="${wishSent}"></span>
    </div>
    <div class="card" th:if="${wishError}" style="color:#c0392b;">
        <span th:text="${wishError}"></span>
    </div>
    <div class="card" style="display:flex; justify-content:flex-end;">
        <a class="btn btn-secondary" th:href="@{/admin/export/birthdays}">Export Birthdays (Excel)</a>
    </div>

    <div class="card">
        <strong th:text="${#lists.size(birthdaysToday) + #lists.size(relativeBirthdaysToday)}">0</strong>
        birthday(s) today
        (<span th:text="${#lists.size(birthdaysToday)}">0</span> policyholder(s),
        <span th:text="${#lists.size(relativeBirthdaysToday)}">0</span> relative(s)).
        Wishes are also sent automatically every day at 10:00 AM IST.
        <form th:action="@{/admin/run-birthday-wishes-now}" method="post" style="display:inline">
            <button class="btn btn-primary" type="submit">Send today's birthday wishes now</button>
        </form>
    </div>

    <div class="card">
        <h3>Policyholders</h3>
        <table id="policyholderTable">
            <thead>
            <tr>
                <th>Name</th><th>Date of Birth</th><th>Next Birthday</th><th>Email</th><th>Phone</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${entries}">
                <td th:text="${e.customer.fullName}"></td>
                <td th:text="${e.customer.dateOfBirth}"></td>
                <td th:text="${e.nextBirthday}"></td>
                <td th:text="${e.customer.email}"></td>
                <td th:text="${e.customer.phone}"></td>
                <td class="actions-cell">
                    <form class="inline" th:action="@{/admin/birthdays/{id}/send(id=${e.customer.id})}" method="post">
                        <button class="btn btn-success" type="submit">Send Wish Now</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pager-bar" id="policyholderPager" style="margin-top:10px;"></div>
    </div>

    <div class="card">
        <h3>Relatives</h3>
        <table id="relativeBirthdayTable">
            <thead>
            <tr>
                <th>Name</th><th>Relation</th><th>Policyholder</th><th>Date of Birth</th>
                <th>Next Birthday</th><th>Email</th><th>Phone</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${relativeEntries}">
                <td th:text="${e.relative.fullName}"></td>
                <td th:text="${e.relative.relation ?: '-'}"></td>
                <td>
                    <span th:text="${e.relative.customer.fullName}"></span>
                </td>
                <td th:text="${e.relative.dateOfBirth}"></td>
                <td th:text="${e.nextBirthday}"></td>
                <td th:text="${e.relative.email}"></td>
                <td th:text="${e.relative.phone}"></td>
                <td class="actions-cell">
                    <form class="inline" th:action="@{/admin/relatives/{id}/send-wish(id=${e.relative.id})}" method="post">
                        <button class="btn btn-success" type="submit">Send Wish Now</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pager-bar" id="relativePager" style="margin-top:10px;"></div>
    </div>
</div>

<script>
    // Reusable client-side pager: hides/shows <tr> elements in a tbody based on the
    // current page and page size, without ever removing them from the DOM (so any
    // per-row forms/state stay intact when navigating between pages).
    function setupPager(tableId, controlsId, defaultSize) {
        const rows = Array.from(document.querySelectorAll('#' + tableId + ' tbody tr'));
        const controls = document.getElementById(controlsId);
        let pageSize = defaultSize;
        let currentPage = 0;

        function totalPages() {
            return Math.max(1, Math.ceil(rows.length / pageSize));
        }

        function render() {
            const tp = totalPages();
            currentPage = Math.max(0, Math.min(currentPage, tp - 1));
            const start = currentPage * pageSize;
            const end = start + pageSize;
            rows.forEach((row, i) => {
                row.style.display = (i >= start && i < end) ? '' : 'none';
            });

            controls.innerHTML = `
                <div class="pager-bar">
                    <label class="small-note" style="margin-right:6px;">Rows per page:</label>
                    <select class="pager-size">
                        ${[10, 20, 30, 50].map(n => `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>
                </div>
                <span class="small-note">Page ${rows.length ? currentPage + 1 : 0} of ${tp} (${rows.length} total)</span>
                <div class="pager-bar">
                    <button type="button" class="btn btn-secondary pager-arrow pager-first" ${currentPage === 0 ? 'disabled' : ''} title="First page">&laquo;</button>
                    <button type="button" class="btn btn-secondary pager-arrow pager-prev" ${currentPage === 0 ? 'disabled' : ''} title="Previous page">&larr;</button>
                    <button type="button" class="btn btn-secondary pager-arrow pager-next" ${currentPage >= tp - 1 ? 'disabled' : ''} title="Next page">&rarr;</button>
                    <button type="button" class="btn btn-secondary pager-arrow pager-last" ${currentPage >= tp - 1 ? 'disabled' : ''} title="Last page">&raquo;</button>
                </div>
            `;

            controls.querySelector('.pager-size').addEventListener('change', function () {
                pageSize = parseInt(this.value, 10);
                currentPage = 0;
                render();
            });
            controls.querySelector('.pager-first').addEventListener('click', function () { currentPage = 0; render(); });
            controls.querySelector('.pager-prev').addEventListener('click', function () { currentPage--; render(); });
            controls.querySelector('.pager-next').addEventListener('click', function () { currentPage++; render(); });
            controls.querySelector('.pager-last').addEventListener('click', function () { currentPage = totalPages() - 1; render(); });
        }

        render();
    }

    setupPager('policyholderTable', 'policyholderPager', 20);
    setupPager('relativeBirthdayTable', 'relativePager', 20);
</script>
</body>
</html>

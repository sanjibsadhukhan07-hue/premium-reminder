<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Policy - KFS Premium Reminder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <div th:replace="~{fragments/topbar :: favicon}"></div>
    <style>
        /* --- Lightweight typeable datepicker -----------------------------------
           Wraps any input[data-datepicker] with a calendar-icon button and a
           popover month grid. The input itself stays a normal text field, so the
           user can always just type a date directly (YYYY-MM-DD, DD-MM-YYYY, or
           DD/MM/YYYY all parse) - the calendar is an optional shortcut, not a
           replacement for typing. On blur/selection the value is normalized to
           yyyy-MM-dd so it still binds cleanly to LocalDate/@DateTimeFormat(ISO.DATE)
           on the server, exactly like the native <input type="date"> did.

           Year range is configurable per-field via data-min-year-offset /
           data-max-year-offset (years relative to today; defaults -110/0), since
           a birth date and a future renewal date need very different ranges. */
        .dp-wrap { position: relative; display: inline-flex; width: 100%; }
        .dp-wrap input { padding-right: 34px; width: 100%; box-sizing: border-box; }
        .dp-toggle {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            width: 26px; height: 26px; border: none; background: transparent;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 5px; color: var(--text-mid);
        }
        .dp-toggle:hover { background: var(--off-white); }
        .dp-toggle svg { width: 16px; height: 16px; }
        .dp-popover {
            position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
            background: var(--white); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 10px; width: 260px;
            display: none;
        }
        .dp-popover.open { display: block; }
        .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
        .dp-head select { padding: 3px 4px; font-size: 13px; }
        .dp-nav {
            border: 1px solid var(--border); background: var(--white); border-radius: 6px;
            width: 26px; height: 26px; cursor: pointer; font-size: 14px; line-height: 1;
        }
        .dp-nav:hover { background: var(--off-white); }
        .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .dp-grid .dow { font-size: 11px; color: var(--text-mid); padding: 4px 0; font-weight: 700; }
        .dp-grid button {
            border: none; background: transparent; padding: 6px 0; font-size: 12px;
            border-radius: 6px; cursor: pointer; color: var(--navy);
        }
        .dp-grid button:hover { background: var(--off-white); }
        .dp-grid button.muted { color: var(--text-mid); opacity: 0.5; }
        .dp-grid button.selected { background: var(--orange); color: var(--white); }
        .dp-grid button.today:not(.selected) { box-shadow: inset 0 0 0 1px var(--orange); }
        .dp-foot { display: flex; justify-content: space-between; margin-top: 8px; }
        .dp-foot button {
            border: none; background: transparent; color: var(--text-mid); font-size: 12px;
            cursor: pointer; text-decoration: underline;
        }
        .dp-hint { font-size: 11px; color: var(--text-mid); margin-top: 6px; }

        /* --- Lightweight searchable select --------------------------------------
           Wraps any select[data-searchable-select] with a typeahead text input and
           a filtered dropdown list, built entirely from that select's own <option>
           elements - no backend/data changes needed. The select stays in the DOM
           (just visually hidden) so its name/value keep submitting normally and
           any required attribute still applies to it directly. */
        .ss-wrap { position: relative; }
        .ss-wrap select { display: none; }
        .ss-input { width: 100%; box-sizing: border-box; }
        .ss-list {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
            max-height: 240px; overflow-y: auto; background: var(--white);
            border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: none;
        }
        .ss-list.open { display: block; }
        .ss-option { padding: 8px 10px; font-size: 13px; cursor: pointer; }
        .ss-option:hover, .ss-option.active { background: var(--off-white); }
        .ss-option.no-match { color: var(--text-mid); cursor: default; }
    </style>
</head>
<body>
<div th:replace="~{fragments/topbar :: admin('add-policy')}"></div>
<div class="container">
    <div class="card">
        <h2 th:text="${policy.id != null} ? 'Edit Policy' : 'Add Policy'"></h2>
        <form th:action="@{/admin/policies/save}"
              th:object="${policy}" method="post" enctype="multipart/form-data" class="form-grid">
            <input type="hidden" th:field="*{id}">

            <div th:if="${policy.customer == null}">
                <label>Proposer</label>
                <select name="customerId" data-searchable-select required>
                    <option value="">-- select prospector --</option>
                    <option th:each="c : ${customers}" th:value="${c.id}"
                            th:text="${c.fullName} + ' (' + ${c.phone} + ')'"></option>
                </select>
            </div>
            <input th:if="${policy.customer != null}" type="hidden" name="customerId" th:value="${policy.customer.id}">

            <div>
                <label>Policy Holder Name</label>
                <input type="text" th:field="*{policyHolderName}"
                       th:placeholder="${policy.customer != null} ? 'Leave blank if same as the prospector (' + ${policy.customer.fullName} + ')' : 'Leave blank if same as the prospector'">
            </div>
            <div>
                <label>Category</label>
                <select id="category" th:field="*{category}" onchange="toggleCategoryFields()" required>
                    <option th:each="cat : ${T(com.premiumreminder.model.PolicyCategory).values()}"
                            th:value="${cat}" th:text="${cat.label}"></option>
                </select>
            </div>
            <div>
                <label>Insurer (company)</label>
                <input type="text" th:field="*{insurerName}" placeholder="e.g. HDFC, TATA AIG, NIC">
            </div>
            <div>
                <label>Office Tag (agent/office, e.g. PAMPA, FCA, ANUPAM)</label>
                <input type="text" th:field="*{officeTag}">
            </div>
            <div>
                <label>Policy Number</label>
                <input type="text" th:field="*{policyNumber}" required>
            </div>
            <div>
                <label>Plan Type</label>
                <input type="text" th:field="*{planType}" placeholder="e.g. FAMILY, INDIVIDUAL">
            </div>
            <div>
                <label>Policy Type</label>
                <input type="text" th:field="*{policyType}" placeholder="e.g. SECURE, RESTORE, PREMIER">
            </div>
            <div>
                <label>Sum Assured / IDV</label>
                <input type="number" step="0.01" th:field="*{sumAssured}">
            </div>
            <div id="healthField">
                <label>Health Check-up Note</label>
                <input type="text" th:field="*{healthCheckupNote}" placeholder="e.g. 2.5K EVERY YEAR">
            </div>
            <div id="motorField">
                <label>Vehicle Registration No.</label>
                <input type="text" th:field="*{vehicleRegistrationNo}" placeholder="e.g. WB-16-AV-1309">
            </div>
            <div>
                <label>Premium Amount</label>
                <input type="number" step="0.01" th:field="*{premiumAmount}" required>
            </div>
            <div>
                <label>Start Date</label>
                <input type="text" th:field="*{startDate}" data-datepicker
                       data-min-year-offset="-60" data-max-year-offset="1" placeholder="DD-MM-YYYY">
            </div>
            <div>
                <label>Renewal / Next Due Date</label>
                <input type="text" th:field="*{nextDueDate}" data-datepicker
                       data-min-year-offset="-5" data-max-year-offset="15" placeholder="DD-MM-YYYY" required>
            </div>
            <div>
                <label>Premium Frequency</label>
                <select th:field="*{premiumFrequency}" required>
                    <option th:each="freq : ${T(com.premiumreminder.model.PremiumFrequency).values()}"
                            th:value="${freq}" th:text="${freq.label}"></option>
                </select>
            </div>
            <div>
                <label>Reminder Window (days before AND after due date)</label>
                <input type="number" th:field="*{reminderWindowDays}">
            </div>
            <div>
                <label>Already Paid</label>
                <input type="checkbox" th:field="*{paid}">
            </div>
            <div>
                <label>Active</label>
                <input type="checkbox" th:field="*{active}">
            </div>

            <div style="grid-column: span 2; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border);">
                <label>Policy Document (PDF only)</label>
                <p th:if="${policy.policyDocFileName != null}" style="margin: 6px 0 10px;">
                    Current file: <span th:text="${policy.policyDocFileName}"></span>
                    <a th:href="@{/admin/policies/{id}/policy-doc(id=${policy.id})}" target="_blank">(view)</a>
                </p>
                <input type="file" name="policyDoc" accept="application/pdf,.pdf">
                <p style="margin-top: 6px; color: var(--text-mid); font-size: 13px;">
                    <span th:if="${policy.policyDocFileName != null}">Leave blank to keep the existing document.</span>
                    <span th:unless="${policy.policyDocFileName != null}">Optional — you can also add this later.</span>
                </p>
            </div>

            <div style="grid-column: span 2;">
                <button class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleCategoryFields() {
        var category = document.getElementById('category').value;
        document.getElementById('healthField').style.display = (category === 'HEALTH') ? '' : 'none';
        document.getElementById('motorField').style.display = (category === 'MOTOR') ? '' : 'none';
    }
    toggleCategoryFields();
</script>

<script>
    // ---------------------------------------------------------------------------
    // Minimal, dependency-free typeable datepicker. Attaches to every
    // input[data-datepicker] on the page. Two ways in, both land on the same
    // normalized yyyy-MM-dd value the server expects:
    //   1) Type directly - accepts yyyy-MM-dd, dd-MM-yyyy, or dd/MM/yyyy, and
    //      normalizes to yyyy-MM-dd on blur.
    //   2) Click the calendar icon - pick a day/month/year from the popover.
    // ---------------------------------------------------------------------------
    (function () {
        const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

        function pad(n) { return String(n).padStart(2, '0'); }

        // ISO (yyyy-MM-dd) is what actually gets submitted to the server, via a
        // hidden field, so LocalDate/@DateTimeFormat(iso = DATE) binding needs no
        // backend changes. dd-MM-yyyy is only ever shown to / typed by the user.
        function toIso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
        function toDisplay(y, m, d) { return pad(d) + '-' + pad(m + 1) + '-' + y; }

        // Parses "dd-MM-yyyy", "dd/MM/yyyy", "yyyy-MM-dd" (and 2-digit years) into
        // a {y, m (0-based), d} object, or null if it doesn't recognize the string.
        // dd-MM-yyyy is tried first since that's the format the user now sees/types.
        function parseFlexible(raw) {
            if (!raw) return null;
            const s = raw.trim();

            let m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
            if (m) return normalize(+m[3], +m[2] - 1, +m[1]);

            m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
            if (m) return normalize(+m[1], +m[2] - 1, +m[3]);

            m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2})$/);
            if (m) {
                let year = +m[3];
                year += (year < 50 ? 2000 : 1900);
                return normalize(year, +m[2] - 1, +m[1]);
            }

            return null;
        }

        function normalize(y, m, d) {
            const date = new Date(y, m, d);
            if (date.getFullYear() !== y || date.getMonth() !== m || date.getDate() !== d) return null;
            return { y, m, d };
        }

        function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

        // The original th:field-bound input becomes a hidden field carrying the ISO
        // value the server expects; a new visible text input (dd-MM-yyyy) is what
        // the user actually sees and types into, kept in sync with the hidden one.
        function attach(boundInput) {
            if (boundInput.dataset.dpAttached) return;
            boundInput.dataset.dpAttached = 'true';

            const today = new Date();
            const minYear = today.getFullYear() + parseInt(boundInput.dataset.minYearOffset || '-110', 10);
            const maxYear = today.getFullYear() + parseInt(boundInput.dataset.maxYearOffset || '0', 10);

            const initialIso = boundInput.value;
            boundInput.type = 'hidden';

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = boundInput.placeholder || 'DD-MM-YYYY';
            const isoMatch = initialIso.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            const initialParsed = isoMatch ? normalize(+isoMatch[1], +isoMatch[2] - 1, +isoMatch[3]) : null;
            if (initialParsed) input.value = toDisplay(initialParsed.y, initialParsed.m, initialParsed.d);

            const wrap = document.createElement('div');
            wrap.className = 'dp-wrap';
            boundInput.parentNode.insertBefore(wrap, boundInput);
            wrap.appendChild(input);
            wrap.appendChild(boundInput);

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'dp-toggle';
            toggle.setAttribute('aria-label', 'Open calendar');
            toggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
            wrap.appendChild(toggle);

            const popover = document.createElement('div');
            popover.className = 'dp-popover';
            wrap.appendChild(popover);

            let viewYear = Math.min(Math.max(today.getFullYear(), minYear), maxYear);
            let viewMonth = today.getMonth();
            let selected = initialParsed;
            if (selected) { viewYear = selected.y; viewMonth = selected.m; }

            function renderPopover() {
                const yearOptions = [];
                for (let y = maxYear; y >= minYear; y--) {
                    yearOptions.push('<option value="' + y + '"' + (y === viewYear ? ' selected' : '') + '>' + y + '</option>');
                }
                const monthOptions = MONTH_NAMES.map((name, i) =>
                    '<option value="' + i + '"' + (i === viewMonth ? ' selected' : '') + '>' + name + '</option>').join('');

                let grid = '<div class="dp-grid">' + DOW.map(d => '<span class="dow">' + d + '</span>').join('');

                const firstOfMonth = new Date(viewYear, viewMonth, 1).getDay();
                const totalDays = daysInMonth(viewYear, viewMonth);
                const prevMonthDays = daysInMonth(viewYear, viewMonth - 1 < 0 ? 11 : viewMonth - 1);

                for (let i = 0; i < firstOfMonth; i++) {
                    const d = prevMonthDays - firstOfMonth + i + 1;
                    grid += '<button type="button" class="muted" disabled>' + d + '</button>';
                }
                for (let d = 1; d <= totalDays; d++) {
                    const isSelected = selected && selected.y === viewYear && selected.m === viewMonth && selected.d === d;
                    const isToday = today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === d;
                    grid += '<button type="button" data-day="' + d + '" class="' +
                        (isSelected ? 'selected' : '') + (isToday ? ' today' : '') + '">' + d + '</button>';
                }
                const remaining = (7 - ((firstOfMonth + totalDays) % 7)) % 7;
                for (let d = 1; d <= remaining; d++) {
                    grid += '<button type="button" class="muted" disabled>' + d + '</button>';
                }
                grid += '</div>';

                popover.innerHTML =
                    '<div class="dp-head">' +
                        '<button type="button" class="dp-nav dp-prev">&lsaquo;</button>' +
                        '<select class="dp-month">' + monthOptions + '</select>' +
                        '<select class="dp-year">' + yearOptions + '</select>' +
                        '<button type="button" class="dp-nav dp-next">&rsaquo;</button>' +
                    '</div>' +
                    grid +
                    '<div class="dp-foot">' +
                        '<button type="button" class="dp-today">Today</button>' +
                        '<button type="button" class="dp-clear">Clear</button>' +
                    '</div>' +
                    '<div class="dp-hint">Or just type a date (DD-MM-YYYY, DD/MM/YYYY, YYYY-MM-DD)</div>';

                popover.querySelector('.dp-prev').addEventListener('click', () => { shiftMonth(-1); });
                popover.querySelector('.dp-next').addEventListener('click', () => { shiftMonth(1); });
                popover.querySelector('.dp-month').addEventListener('change', function () { viewMonth = +this.value; renderPopover(); });
                popover.querySelector('.dp-year').addEventListener('change', function () { viewYear = +this.value; renderPopover(); });
                popover.querySelector('.dp-today').addEventListener('click', () => {
                    const clampedYear = Math.min(Math.max(today.getFullYear(), minYear), maxYear);
                    selected = { y: clampedYear, m: clampedYear === today.getFullYear() ? today.getMonth() : 0,
                                 d: clampedYear === today.getFullYear() ? today.getDate() : 1 };
                    viewYear = selected.y; viewMonth = selected.m;
                    commit();
                });
                popover.querySelector('.dp-clear').addEventListener('click', () => {
                    selected = null;
                    input.value = '';
                    close();
                });
                popover.querySelectorAll('.dp-grid button[data-day]').forEach(btn => {
                    btn.addEventListener('click', function () {
                        selected = { y: viewYear, m: viewMonth, d: +this.dataset.day };
                        commit();
                    });
                });
            }

            function shiftMonth(delta) {
                viewMonth += delta;
                if (viewMonth < 0) { viewMonth = 11; viewYear--; }
                if (viewMonth > 11) { viewMonth = 0; viewYear++; }
                viewYear = Math.min(Math.max(viewYear, minYear), maxYear);
                renderPopover();
            }

            function commit() {
                input.value = toDisplay(selected.y, selected.m, selected.d);
                boundInput.value = toIso(selected.y, selected.m, selected.d);
                close();
                boundInput.dispatchEvent(new Event('change', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            }

            function open() {
                renderPopover();
                popover.classList.add('open');
                document.addEventListener('mousedown', onOutsideClick);
            }

            function close() {
                popover.classList.remove('open');
                document.removeEventListener('mousedown', onOutsideClick);
            }

            function onOutsideClick(e) {
                if (!wrap.contains(e.target)) close();
            }

            toggle.addEventListener('click', function () {
                popover.classList.contains('open') ? close() : open();
            });

            // Typed input: normalize to dd-MM-yyyy for display once the user leaves
            // the field, push the equivalent ISO value into the hidden bound field,
            // and keep the calendar's month/year in sync if it's open. If the field
            // is cleared, the hidden ISO value is cleared too.
            input.addEventListener('blur', function () {
                const parsed = parseFlexible(input.value);
                if (parsed) {
                    selected = parsed;
                    input.value = toDisplay(parsed.y, parsed.m, parsed.d);
                    boundInput.value = toIso(parsed.y, parsed.m, parsed.d);
                    boundInput.dispatchEvent(new Event('change', { bubbles: true }));
                } else if (input.value.trim() !== '') {
                    input.classList.add('dp-invalid');
                    return;
                } else {
                    selected = null;
                    boundInput.value = '';
                }
                input.classList.remove('dp-invalid');
            });
            input.addEventListener('input', function () {
                input.classList.remove('dp-invalid');
            });
        }

        document.querySelectorAll('input[data-datepicker]').forEach(attach);
    })();
</script>

<script>
    // ---------------------------------------------------------------------------
    // Minimal, dependency-free searchable select. Attaches to every
    // select[data-searchable-select] on the page. The real <select> stays in the
    // DOM (hidden via CSS) so its name/value/required keep working exactly as a
    // normal select would on submit; a text input + dropdown list sit on top of
    // it purely for typeahead filtering, built from the select's own <option>s.
    // ---------------------------------------------------------------------------
    (function () {
        function attach(select) {
            if (select.dataset.ssAttached) return;
            select.dataset.ssAttached = 'true';

            const options = Array.from(select.options).filter(o => o.value !== '');
            const placeholder = select.querySelector('option[value=""]');
            const placeholderText = placeholder ? placeholder.textContent : 'Search...';

            const wrap = document.createElement('div');
            wrap.className = 'ss-wrap';
            select.parentNode.insertBefore(wrap, select);
            wrap.appendChild(select);

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'ss-input';
            input.autocomplete = 'off';
            input.placeholder = placeholderText;
            wrap.insertBefore(input, select);

            const list = document.createElement('div');
            list.className = 'ss-list';
            wrap.appendChild(list);

            const selectedOption = options.find(o => o.selected);
            if (selectedOption) input.value = selectedOption.textContent;

            let activeIndex = -1;

            function selectedLabel() {
                const opt = options.find(o => o.value === select.value);
                return opt ? opt.textContent : '';
            }

            function renderList(filterText) {
                const q = (filterText || '').trim().toLowerCase();
                const matches = options.filter(o => o.textContent.toLowerCase().includes(q));
                activeIndex = -1;

                list.innerHTML = matches.length
                    ? matches.map(o =>
                        '<div class="ss-option" data-value="' + o.value + '">' + o.textContent + '</div>').join('')
                    : '<div class="ss-option no-match">No matches</div>';

                list.querySelectorAll('.ss-option[data-value]').forEach(el => {
                    el.addEventListener('mousedown', function (e) {
                        e.preventDefault(); // fires before input's blur/outside-click handler
                        selectValue(this.dataset.value, this.textContent);
                    });
                });
                return matches;
            }

            function selectValue(value, label) {
                select.value = value;
                input.value = label;
                select.dispatchEvent(new Event('change', { bubbles: true }));
                close();
            }

            function open() {
                renderList(input.value === selectedLabel() ? '' : input.value);
                list.classList.add('open');
                document.addEventListener('mousedown', onOutsideClick);
            }

            function close() {
                list.classList.remove('open');
                document.removeEventListener('mousedown', onOutsideClick);
            }

            function onOutsideClick(e) {
                if (!wrap.contains(e.target)) {
                    // Revert to the actual selected option's label if the user typed
                    // something and clicked away without picking anything from the list.
                    input.value = selectedLabel();
                    close();
                }
            }

            input.addEventListener('focus', open);
            input.addEventListener('input', function () {
                renderList(input.value);
                list.classList.add('open');
            });
            input.addEventListener('keydown', function (e) {
                const items = Array.from(list.querySelectorAll('.ss-option[data-value]'));
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (!list.classList.contains('open')) { open(); return; }
                    activeIndex = Math.min(activeIndex + 1, items.length - 1);
                    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, 0);
                    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (activeIndex >= 0 && items[activeIndex]) {
                        selectValue(items[activeIndex].dataset.value, items[activeIndex].textContent);
                    }
                } else if (e.key === 'Escape') {
                    input.value = selectedLabel();
                    close();
                }
            });
        }

        document.querySelectorAll('select[data-searchable-select]').forEach(attach);
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relative Form - KFS Premium Reminder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <div th:replace="~{fragments/topbar :: favicon}"></div>
</head>
<body>
<div th:replace="~{fragments/topbar :: admin('relatives')}"></div>
<div class="container">
    <div class="card">
        <h2 th:text="${relative.id != null} ? 'Edit Relative' : 'Add Relative'"></h2>
        <form th:action="@{/admin/relatives/save}" th:object="${relative}" method="post" class="form-grid">
            <input type="hidden" th:field="*{id}">
            <div>
                <label>Policyholder (Customer)</label>
                <select name="customerId" required>
                    <option value="">-- select customer --</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.id}"
                            th:text="${c.fullName} + ' (' + ${c.email} + ')'"
                            th:selected="${relative.customer != null and relative.customer.id == c.id}"></option>
                </select>
            </div>
            <div>
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" required>
            </div>
            <div>
                <label>Relation (e.g. Spouse, Son, Daughter)</label>
                <input type="text" th:field="*{relation}">
            </div>
            <div>
                <label>Date of Birth</label>
                <input type="date" th:field="*{dateOfBirth}" required>
            </div>
            <div>
                <label>Email</label>
                <input type="email" th:field="*{email}">
            </div>
            <div>
                <label>Phone (E.164, e.g. +9198XXXXXXXX)</label>
                <input type="text" th:field="*{phone}" required>
            </div>
            <div>
                <label>Message Language</label>
                <select th:field="*{messageLanguage}">
                    <option value="ENGLISH">English</option>
                    <option value="HINDI">Hindi</option>
                    <option value="BENGALI">Bengali</option>
                </select>
            </div>
            <div style="grid-column: span 2;">
                <button class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

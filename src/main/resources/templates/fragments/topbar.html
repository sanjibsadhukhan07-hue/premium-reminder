<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<link th:fragment="favicon" rel="icon" type="image/png" th:href="@{/images/logo.png}">
<div th:fragment="admin(active)" class="topbar">
    <div class="brand">
        <img th:src="@{/images/logo.png}" alt="KFS">
        <strong>Premium Reminder — Admin</strong>
    </div>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active-link'">Dashboard</a>
        <a th:href="@{/admin/policies}" th:classappend="${active == 'policies'} ? 'active-link'">Policies by Insurer</a>
        <a th:href="@{/admin/policies/new}" th:classappend="${active == 'add-policy'} ? 'active-link'">Add Policy</a>
        <a th:href="@{/admin/customers/new}" th:classappend="${active == 'add-customer'} ? 'active-link'">Add Customer</a>
        <a th:href="@{/admin/birthdays}" th:classappend="${active == 'birthdays'} ? 'active-link'">Birthdays</a>
        <a th:href="@{/admin/birthday-logs}" th:classappend="${active == 'birthday-logs'} ? 'active-link'">Birthday Logs</a>
        <a th:href="@{/admin/relatives}" th:classappend="${active == 'relatives'} ? 'active-link'">Relatives</a>
        <a th:href="@{/admin/reminder-logs}" th:classappend="${active == 'logs'} ? 'active-link'">Reminder Logs</a>
    </div>
    <div class="nav-actions">
        <a class="btn btn-icon btn-secondary" th:href="@{/admin/birthday-template}"
           th:classappend="${active == 'birthday-template'} ? ' active-link'"
           title="Birthday Card Template" aria-label="Birthday Card Template">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
            </svg>
        </a>
        <a class="btn btn-icon btn-secondary" th:href="@{/admin/settings}"
           th:classappend="${active == 'settings'} ? ' active-link'"
           title="Settings" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
        <a class="btn btn-icon btn-secondary" th:href="@{/account/change-password}"
           title="Change Password" aria-label="Change Password">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
            </svg>
        </a>
        <form th:action="@{/logout}" method="post" class="inline" style="margin:0;">
            <button class="btn btn-danger" type="submit">Logout</button>
        </form>
    </div>
</div>
</body>
</html>

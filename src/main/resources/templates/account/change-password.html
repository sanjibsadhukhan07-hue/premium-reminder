<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password - KFS Premium Reminder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-box" style="margin-top: 60px;">
    <div class="logo-wrap"><img th:src="@{/images/logo.png}" alt="Koley Financial Services"></div>
    <h1>Change Password</h1>
    <p th:if="${forced}" style="color: var(--text-mid); font-size: 13px; margin-bottom: 14px;">
        This account is still on a temporary password. Please set a new one to continue.
    </p>
    <div th:if="${changePasswordError}" class="error" th:text="${changePasswordError}"></div>
    <div th:if="${changePasswordSuccess}" class="success" th:text="${changePasswordSuccess}"></div>

    <form th:action="@{/account/change-password}" method="post">
        <label>Current Password</label>
        <input type="password" name="currentPassword" required autofocus>
        <label>New Password (min. 8 characters)</label>
        <input type="password" name="newPassword" required minlength="8">
        <label>Confirm New Password</label>
        <input type="password" name="confirmPassword" required minlength="8">
        <button type="submit">Update Password</button>
    </form>

    <p th:unless="${forced}" style="margin-top: 18px; font-size: 13px;">
        <a th:href="@{/}" style="color: var(--navy);">&larr; Back to dashboard</a>
    </p>
</div>
</body>
</html>

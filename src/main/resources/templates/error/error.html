<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - KFS Premium Reminder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <div th:replace="~{fragments/topbar :: favicon}"></div>
</head>
<body>
<div class="container">
    <div class="card" style="border-left: 4px solid #c0392b;">
        <h2 th:text="${errorTitle ?: 'Error'}"></h2>
        <p th:text="${errorMessage ?: 'An unexpected error occurred.'}"></p>
        <a class="btn btn-primary" href="javascript:history.back()">Go Back</a>
    </div>
</div>
</body>
</html>

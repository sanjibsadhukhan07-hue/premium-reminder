server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/premiumreminder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    resend-api-key: ${RESEND_API_KEY:}
  sms:
    fast2sms:
      api-key: ${FAST2SMS_API_KEY:}
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:premium_reminder}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
  scheduler:
    cron: ${REMINDER_CRON:0 */5 * * * *}   # every 5 minutes by default
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme123}
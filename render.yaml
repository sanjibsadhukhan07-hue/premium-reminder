databases:
  - name: premium-reminder-db
    plan: free
    databaseName: premiumreminder
    user: premiumreminder

services:
  - type: web
    name: premium-reminder
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: premium-reminder-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: premium-reminder-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: premium-reminder-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: premium-reminder-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: premium-reminder-db
          property: password
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: premium_reminder
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false